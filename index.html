<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIJOLOCRAFT | CANAL DO YOUTUBE</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #CC0000;
    --yellow: #FFD700;
    --black: #0F0F0F;
    --dark: #181818;
    --gray: #222;
    --text: #F1F1F1;
  }

    * {margin:0; padding:0; box-sizing:border-box;}
  body {
    background: var(--black);
    color:var(--text);
    font-family: 'Inter', sans-serif;
  }

  header {
    background: var(--dark);
    padding:20px;
    border-bottom:2px solid var(--red);
    position:sticky;
    top:0;
    z-index:10;
  }
 .header-content {
    max-width:1300px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  header h1 {
    font-family: 'Oswald', sans-serif;
    font-size:1.8em;
    color:var(--red);
    letter-spacing:1px;
  }
  header h1 span {color:var(--yellow);}
  header p {font-size:0.9em; color:#aaa;}

.container {max-width:1300px; margin:30px auto; padding:0 20px;}

.live-banner {
    background: var(--red);
    padding:15px 20px;
    margin-bottom:30px;
    border-radius:8px;
    display:none;
    text-align:center;
    font-weight:700;
  }
.live-banner a {color:#fff; text-decoration:none; font-size:1.1em;}
.live-banner a:hover {text-decoration:underline;}

.section-title {
    font-family: 'Oswald', sans-serif;
    font-size:1.5em;
    color:var(--text);
    margin:40px 0 20px;
    border-left:4px solid var(--red);
    padding-left:12px;
  }

.videos {display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px; margin-bottom:40px;}
.video-card {
    background:var(--gray);
    border-radius:12px;
    overflow:hidden;
    transition: transform 0.2s ease;
  }
.video-card:hover {transform: translateY(-4px);}
.video-card iframe {width:100%; height:180px; border:none;}
.video-info {padding:12px;}
.video-info h4 {font-size:1em; font-weight:600; line-height:1.4; height:44px; overflow:hidden;}

.grid-2 {display:grid; grid-template-columns: 1fr 1fr; gap:30px;}
@media(max-width: 900px) {.grid-2 {grid-template-columns: 1fr;}}

.box {
    background:var(--dark);
    border:1px solid #333;
    padding:20px;
    border-radius:12px;
  }
.box h3 {
    font-family: 'Oswald', sans-serif;
    font-size:1.2em;
    color:var(--yellow);
    margin-bottom:15px;
  }
.lista-comentarios {max-height:400px; overflow-y:auto; margin-bottom:15px;}
.lista-comentarios::-webkit-scrollbar {width:6px;}
.lista-comentarios::-webkit-scrollbar-thumb {background:#444; border-radius:3px;}
.comentario {
    background:#262626;
    padding:10px 14px;
    margin-bottom:8px;
    border-radius:8px;
    font-size:0.9em;
  }
.comentario b {color:var(--red);}
.form-comentario {display:flex; gap:10px; flex-wrap:wrap;}
.form-comentario input {
    flex:1;
    min-width:150px;
    padding:10px 12px;
    border:1px solid #444;
    background:#111;
    color:#fff;
    border-radius:6px;
    font-size:0.9em;
  }
.form-comentario button {
    padding:10px 18px;
    background:var(--red);
    color:#fff;
    cursor:pointer;
    font-weight:700;
    border:none;
    border-radius:6px;
    transition: background 0.2s;
  }
.form-comentario button:hover {background:#A30000;}

#chat-ia {
    height:400px;
    overflow-y:auto;
    background:#111;
    border:1px solid #333;
    padding:15px;
    margin-bottom:15px;
    border-radius:8px;
    font-size:0.9em;
  }
#chat-ia div {margin-bottom:10px;}
footer {text-align:center; padding:30px; color:#666; font-size:0.8em; margin-top:40px;}
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div>
      <h1>TIJOLO<span>CRAFT</span></h1>
      <p>CANAL DO YOUTUBE</p>
    </div>
  </div>
</header>

<div class="container">

  <div id="live-banner" class="live-banner">
    <a id="live-link" href="#" target="_blank">🔴 AO VIVO AGORA</a>
  </div>

  <h2 class="section-title">ÚLTIMOS VÍDEOS</h2>
  <div id="videos" class="videos">Carregando vídeos...</div>

  <div class="grid-2">
    <div class="box">
      <h3>💬 Comunidade</h3>
      <div id="lista-comentarios" class="lista-comentarios"></div>
      <form id="form-comentario" class="form-comentario">
        <input type="text" id="nome" placeholder="Seu nome" required>
        <input type="text" id="comentario" placeholder="Deixe um comentário" required>
        <button type="submit">Enviar</button>
      </form>
    </div>

    <div class="box">
      <h3>🤖 Assistente TijoloCraft</h3>
      <div id="chat-ia">
        <div><b style="color:#FFD700">Assistente:</b> Olá! Sou a IA oficial do TijoloCraft. Posso te ajudar com dúvidas sobre vídeos, configurações e Minecraft.</div>
      </div>
      <form id="form-ia" class="form-comentario">
        <input type="text" id="input-ia" placeholder="Faça sua pergunta..." required>
        <button type="submit">Enviar</button>
      </form>
    </div>
  </div>

</div>

<footer>
  © 2026 TIJOLOCRAFT | CANAL DO YOUTUBE
</footer>

<script>
const shader_id = "home";
let historicoIA = [];

async function carregarVideos() {
  const res = await fetch('/api/youtube');
  const data = await res.json();

  if(data.live.items && data.live.items.length > 0) {
    const live = data.live.items[0];
    document.getElementById('live-banner').style.display = 'block';
    document.getElementById('live-link').href = `https://youtube.com/watch?v=${live.id.videoId}`;
  }

  let html = '';
  data.videos.items.forEach(video => {
    html += `
      <div class="video-card">
        <iframe src="https://www.youtube.com/embed/${video.id.videoId}" allowfullscreen></iframe>
        <div class="video-info">
          <h4>${video.snippet.title}</h4>
        </div>
      </div>
    `;
  });
  document.getElementById('videos').innerHTML = html;
}

async function carregarComentarios() {
  const res = await fetch(`/api/comentarios?shader_id=${shader_id}`);
  const data = await res.json();
  let html = '';
  data.forEach(c => {
    html += `<div class="comentario"><b>${c.nome}:</b> ${c.comentario}</div>`;
  });
  document.getElementById('lista-comentarios').innerHTML = html;
}

document.getElementById('form-comentario').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nome = document.getElementById('nome').value;
  const comentario = document.getElementById('comentario').value;
  await fetch('/api/comentar', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({shader_id, nome, comentario})
  });
  document.getElementById('comentario').value = "";
  carregarComentarios();
});

document.getElementById('form-ia').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('input-ia');
  const mensagem = input.value;
  const chatDiv = document.getElementById('chat-ia');

  chatDiv.innerHTML += `<div><b style="color:#fff">Você:</b> ${mensagem}</div>`;
  historicoIA.push({role: "user", content: mensagem});
  input.value = "";
  chatDiv.scrollTop = chatDiv.scrollHeight;

  const res = await fetch('/api/ia', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ mensagem, historico: historicoIA })
  });
  const data = await res.json();

  chatDiv.innerHTML += `<div><b style="color:#FFD700">Assistente:</b> ${data.resposta}</div>`;
  historicoIA.push({role: "assistant", content: data.resposta});
  chatDiv.scrollTop = chatDiv.scrollHeight;
});

carregarVideos();
carregarComentarios();
setInterval(carregarComentarios, 5000);
</script>

</body>
</html>
