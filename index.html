<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tijolo Craft | Site Oficial</title>
  <style>
    :root {
      --bg: #0A0E1A;
      --card: #111827;
      --border: #1F2937;
      --primary: #6366F1; /* Roxo/Azul */
      --primary-hover: #4F46E5;
      --text: #F9FAFB;
      --text-sec: #9CA3AF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.6; }
    
    header { 
      background: var(--card); 
      padding: 20px; 
      text-align: center; 
      border-bottom: 2px solid var(--primary);
    }
    header h1 { color: var(--primary); font-size: 2.5rem; }
    header p { color: var(--text-sec); }

    nav { display: flex; justify-content: center; gap: 10px; background: var(--card); padding: 15px; border-bottom: 1px solid var(--border); }
    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-sec);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    .conteudo-aba { display: none; }
    .conteudo-aba.active { display: block; }

    .grid-videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card-video {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      transition: 0.3s;
    }
    .card-video:hover { transform: translateY(-5px); border-color: var(--primary); }
    .card-video img { width: 100%; }
    .card-video h3 { padding: 15px; font-size: 1rem; }

    .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
    .card input, .card textarea {
      width: 100%; padding: 12px; margin: 8px 0; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    }
    .card button {
      background: var(--primary); color: white; border: none; padding: 12px 20px;
      border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s;
    }
    .card button:hover { background: var(--primary-hover); }
    .comentario { background: var(--bg); padding: 10px; border-radius: 8px; margin: 8px 0; }
    
    footer { text-align: center; padding: 30px; color: var(--text-sec); border-top: 1px solid var(--border); margin-top: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>🧱 Tijolo Craft</h1>
    <p>O canal de Minecraft mais insano do Brasil</p>
  </header>

  <nav>
    <button class="tab-btn active" onclick="mostrarAba('videos', this)">Vídeos</button>
    <button class="tab-btn" onclick="mostrarAba('comunidade', this)">Comunidade</button>
    <button class="tab-btn" onclick="mostrarAba('ia', this)">IA Tijolo</button>
  </nav>

  <div class="container">
    <div id="videos" class="conteudo-aba active">
      <h2>Últimos Vídeos</h2>
      <div id="grid-videos" class="grid-videos">Carregando vídeos...</div>
    </div>

    <div id="comunidade" class="conteudo-aba">
      <h2>Comunidade</h2>
      <div class="card">
        <h3>Deixe seu comentário</h3>
        <input type="text" id="nome-comentario" placeholder="Seu nome">
        <textarea id="texto-comentario" placeholder="Sua mensagem..." rows="3"></textarea>
        <button onclick="enviarComentario()">Enviar</button>
      </div>
      <div id="lista-comentarios"></div>
    </div>

    <div id="ia" class="conteudo-aba">
      <h2>IA do Tijolo</h2>
      <div class="card">
        <p>Me pergunta qualquer coisa de Minecraft!</p>
        <input type="text" id="pergunta-ia" placeholder="Ex: como fazer portal do nether?">
        <button onclick="perguntarIA()">Perguntar</button>
        <div id="resposta-ia" style="margin-top: 15px; background: var(--bg); padding: 15px; border-radius: 8px;"></div>
      </div>
    </div>
  </div>

  <footer>
    © 2026 Tijolo Craft. Feito com ódio e café.
  </footer>

  <script>
    const CHANNEL_ID = 'UCtqAb6OTpfT-BRDgVp2aa3w';

    function mostrarAba(id, btn) {
      document.querySelectorAll('.conteudo-aba').forEach(aba => aba.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }

    async function carregarVideos() {
      try {
        const res = await fetch('/api/youtube');
        const data = await res.json();
        document.getElementById('grid-videos').innerHTML = data.items.map(video => `
          <a href="https://youtube.com/watch?v=${video.id.videoId}" target="_blank" class="card-video">
            <img src="${video.snippet.thumbnails.medium.url}" alt="${video.snippet.title}">
            <h3>${video.snippet.title}</h3>
          </a>
        `).join('');
      } catch(e) {
        document.getElementById('grid-videos').innerHTML = '<p>Erro ao carregar vídeos. Checa a API Key no Cloudflare.</p>';
      }
    }

    async function carregarComentarios() {
      const res = await fetch('/api/comentarios');
      const dados = await res.json();
      document.getElementById('lista-comentarios').innerHTML = dados.map(c => `<div class="comentario"><b>${c.nome}</b>: ${c.texto}</div>`).join('');
    }

    async function enviarComentario() {
      const nome = document.getElementById('nome-comentario').value;
      const texto = document.getElementById('texto-comentario').value;
      if(!nome || !texto) return alert('Preenche tudo');
      await fetch('/api/comentar', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({nome, texto})});
      document.getElementById('texto-comentario').value = '';
      carregarComentarios();
    }

    async function perguntarIA() {
      const pergunta = document.getElementById('pergunta-ia').value;
      document.getElementById('resposta-ia').innerText = 'Pensando...';
      const res = await fetch('/api/ia', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({pergunta})});
      const data = await res.json();
      document.getElementById('resposta-ia').innerText = data.resposta;
    }

    carregarVideos();
    carregarComentarios();
  </script>
</body>
</html>
