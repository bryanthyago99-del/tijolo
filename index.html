<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tijolo Craft | Site Oficial</title>
  <style>
    :root {
      --bg: #0A0E1A; --card: #111827; --border: #1F2937;
      --primary: #6366F1; --primary-hover: #4F46E5;
      --text: #F9FAFB; --text-sec: #9CA3AF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.6; }
    
    header { background: var(--card); padding: 20px; text-align: center; border-bottom: 2px solid var(--primary); }
    header h1 { color: var(--primary); font-size: 2.5rem; }
    header p { color: var(--text-sec); }

    nav { display: flex; justify-content: center; gap: 10px; background: var(--card); padding: 15px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .tab-btn { background: transparent; border: 1px solid var(--border); color: var(--text-sec); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .tab-btn.active, .tab-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
    .conteudo-aba { display: none; }
    .conteudo-aba.active { display: block; }

    .grid-videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card-video { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; text-decoration: none; color: var(--text); transition: 0.3s; }
    .card-video:hover { transform: translateY(-5px); border-color: var(--primary); }
    .card-video img { width: 100%; }
    .card-video h3 { padding: 15px; font-size: 1rem; }

    .grid-servidores { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .card-servidor { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; transition: 0.3s; }
    .card-servidor:hover { border-color: var(--primary); transform: translateY(-5px); }
    .status-online { color: #22C55E; font-weight: 700; }
    .status-offline { color: #EF4444; font-weight: 700; }

    .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
    .card input, .card textarea { width: 100%; padding: 12px; margin: 8px 0; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
    .card button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .card button:hover { background: var(--primary-hover); }
    .comentario { background: var(--bg); padding: 15px; border-radius: 8px; margin: 12px 0; border: 1px solid var(--border); }
    .post-img { width: 100%; max-width: 500px; border-radius: 8px; margin-top: 10px; }
    .post-gif { max-width: 300px; border-radius: 8px; margin-top: 10px; }
    .gif-thumb { width: 100%; border-radius: 5px; cursor: pointer; border: 2px solid transparent; }
    .gif-thumb.selecionado { border-color: var(--primary); }
    
    footer { text-align: center; padding: 30px; color: var(--text-sec); border-top: 1px solid var(--border); margin-top: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>🧱 Tijolo Craft</h1>
    <p>O canal de Minecraft mais insano do Brasil</p>
  </header>

  <nav>
    <button class="tab-btn active" onclick="mostrarAba('videos', this)">Vídeos</button>
    <button class="tab-btn" onclick="mostrarAba('comunidade', this)">Comunidade</button>
    <button class="tab-btn" onclick="mostrarAba('servidores', this)">SERVIDORES</button>
    <button class="tab-btn" onclick="mostrarAba('ia', this)">IA Tijolo</button>
  </nav>

  <div class="container">
    <div id="videos" class="conteudo-aba active">
      <h2>Últimos Vídeos</h2>
      <div id="grid-videos" class="grid-videos">Carregando vídeos...</div>
    </div>

    <div id="comunidade" class="conteudo-aba">
      <h2>Comunidade</h2>
      <div class="card">
        <h3>Posta algo pra galera</h3>
        <input type="text" id="nome-comentario" placeholder="Seu nome">
        <textarea id="texto-comentario" placeholder="Sua mensagem..." rows="3"></textarea>
        <input type="text" id="url-foto" placeholder="URL da foto opcional">
        <div style="display:flex; gap:10px; margin:8px 0;">
          <input type="text" id="busca-gif" placeholder="Buscar GIF no Giphy" style="flex:1;">
          <button onclick="buscarGIF()">Buscar GIF</button>
        </div>
        <div id="resultados-gif" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:5px; max-height:200px; overflow-y:auto; margin-bottom:10px;"></div>
        <input type="hidden" id="url-gif">
        <button onclick="enviarComentario()">Enviar Post</button>
      </div>
      <div id="lista-comentarios"></div>
    </div>

    <div id="servidores" class="conteudo-aba">
      <h2>🔥 Servidores Bedrock</h2>
      <div id="grid-servidores" class="grid-servidores">Carregando servidores...</div>
    </div>

    <div id="ia" class="conteudo-aba">
      <h2>IA do Tijolo</h2>
      <div class="card">
        <p>Me pergunta qualquer coisa de Minecraft!</p>
        <input type="text" id="pergunta-ia" placeholder="Ex: como fazer portal do nether?">
        <button onclick="perguntarIA()">Perguntar</button>
        <div id="resposta-ia" style="margin-top: 15px; background: var(--bg); padding: 15px; border-radius: 8px; min-height: 50px;"></div>
      </div>
    </div>
  </div>

  <footer>© 2026 Tijolo Craft. Feito com ódio e café.</footer>

  <script>
    const CHANNEL_ID = 'UCtqAb6OTpfT-BRDgVp2aa3w';

    function mostrarAba(id, btn) {
      document.querySelectorAll('.conteudo-aba').forEach(aba => aba.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }

    async function carregarVideos() {
      try {
        const res = await fetch('/api/youtube');
        const data = await res.json();
        document.getElementById('grid-videos').innerHTML = data.items.map(video => `
          <a href="https://youtube.com/watch?v=${video.id.videoId}" target="_blank" class="card-video">
            <img src="${video.snippet.thumbnails.medium.url}">
            <h3>${video.snippet.title}</h3>
          </a>
        `).join('');
      } catch(e) {
        document.getElementById('grid-videos').innerHTML = '<p>Erro ao carregar vídeos</p>';
      }
    }

    async function carregarComentarios() {
      const res = await fetch('/api/comentarios');
      const dados = await res.json();
      document.getElementById('lista-comentarios').innerHTML = dados.map(c => `
        <div class="comentario">
          <b>${c.nome}</b>: ${c.texto}
          ${c.foto ? `<img src="${c.foto}" class="post-img">` : ''}
          ${c.gif ? `<img src="${c.gif}" class="post-gif">` : ''}
        </div>
      `).join('');
    }

    async function enviarComentario() {
      const nome = document.getElementById('nome-comentario').value;
      const texto = document.getElementById('texto-comentario').value;
      const foto = document.getElementById('url-foto').value;
      const gif = document.getElementById('url-gif').value;
      if(!nome || !texto) return alert('Preenche nome e texto');
      
      await fetch('/api/comentar', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({nome, texto, foto, gif})});
      
      document.getElementById('texto-comentario').value = '';
      document.getElementById('url-foto').value = '';
      document.getElementById('url-gif').value = '';
      document.getElementById('resultados-gif').innerHTML = '';
      const preview = document.getElementById('preview-gif');
      if(preview) preview.remove();
      carregarComentarios();
    }

    async function buscarGIF() {
      const query = document.getElementById('busca-gif').value;
      if(!query) return;
      const resultadosDiv = document.getElementById('resultados-gif');
      resultadosDiv.innerHTML = 'Buscando...';
      try {
        const res = await fetch(`/api/gif?query=${encodeURIComponent(query)}`);
        const data = await res.json();
        if(!data.data || data.data.length === 0) {
          resultadosDiv.innerHTML = '<p>Nenhum GIF encontrado</p>'; return;
        }
        resultadosDiv.innerHTML = data.data.map(gif => `
          <img src="${gif.images.fixed_height_small.url}" class="gif-thumb" onclick="selecionarGIF('${gif.images.downsized.url}', this)">
        `).join('');
      } catch(err) {
        resultadosDiv.innerHTML = '<p>Erro ao buscar GIF</p>';
      }
    }

    function selecionarGIF(url, el) {
      document.querySelectorAll('.gif-thumb').forEach(i => i.classList.remove('selecionado'));
      el.classList.add('selecionado');
      document.getElementById('url-gif').value = url;
      let preview = document.getElementById('preview-gif');
      if(!preview) {
        preview = document.createElement('img');
        preview.id = 'preview-gif';
        preview.className = 'post-gif';
        el.closest('.card').appendChild(preview);
      }
      preview.src = url;
    }

    async function carregarServidores() {
      try {
        const res = await fetch('/api/servidores');
        const data = await res.json();
        document.getElementById('grid-servidores').innerHTML = data.servidores.map(s => `
          <div class="card-servidor">
            <h3>${s.nome}</h3>
            <p><b>IP:</b> ${s.ip}:${s.porta}</p>
            <p><b>Players:</b> ${s.online}/${s.max}</p>
            <p><b>Status:</b> <span class="${s.online > 0 ? 'status-online' : 'status-offline'}">${s.online > 0 ? '🟢 Online' : '🔴 Offline'}</span></p>
          </div>
        `).join('');
      } catch(e) {
        document.getElementById('grid-servidores').innerHTML = '<p>Erro ao carregar servidores</p>';
      }
    }

    async function perguntarIA() {
      const pergunta = document.getElementById('pergunta-ia').value;
      document.getElementById('resposta-ia').innerText = 'Pensando...';
      const res = await fetch('/api/ia', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({pergunta})});
      const data = await res.json();
      document.getElementById('resposta-ia').innerText = data.resposta;
    }

    carregarVideos();
    carregarComentarios();
    carregarServidores();
  </script>
</body>
</html>
