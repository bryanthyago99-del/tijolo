<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tijolo Craft - Portal BR</title>
<style>
  :root{--red:#D32F2F;--red-dark:#B71C1C;--bg:#FFFFFF;--card:#F5F5F5}
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:var(--bg);color:#222}
  header{background:var(--red);color:#fff;padding:12px;position:sticky;top:0;z-index:10;box-shadow:0 2px 5px rgba(0,0,0,0.2)}
  header h1{text-align:center;font-size:22px}
  nav{display:flex;justify-content:space-around;padding:10px 0;background:#fff;border-bottom:2px solid var(--red)}
  nav button{background:none;border:none;color:var(--red);font-weight:bold;font-size:14px;cursor:pointer;padding:8px}
  nav button.active{border-bottom:3px solid var(--red)}
 .aba{display:none}.aba.ativa{display:block}
 .card{background:var(--card);padding:15px;margin:10px;border-radius:10px}
  input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-bottom:10px}
 .btn{background:var(--red);color:#fff;border:none;padding:10px 15px;border-radius:8px;cursor:pointer;font-weight:bold}
 .btn:hover{background:var(--red-dark)}
 .comentario{border-bottom:1px solid #ddd;padding:10px 0}
 .comentario img,.comentario gif{max-width:200px;border-radius:8px;margin-top:5px}
 .server{display:flex;justify-content:space-between;padding:10px}
 .online{color:green}.offline{color:red}

  /* SHORTS ESTILO REELS */
  #lista-shorts{height:calc(100vh - 140px);overflow-y:scroll;scroll-snap-type:y mandatory}
 .short{height:100%;scroll-snap-align:start;display:flex;justify-content:center;align-items:center;background:#000}
 .short iframe{width:100%;max-width:400px;height:80vh;border:none;border-radius:10px}
 .video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px;padding:10px}
 .video iframe{width:100%;aspect-ratio:16/9;border-radius:10px}
  #gif-box{display:flex;gap:5px;overflow-x:auto;margin:10px 0}
  #gif-box img{height:60px;cursor:pointer;border-radius:5px}
</style>
</head>
<body>

<header><h1>🧱 TIJOLO CRAFT</h1></header>
<nav>
  <button onclick="mostrarAba('videos')" class="active">VÍDEOS</button>
  <button onclick="mostrarAba('shorts')">SHORTS</button>
  <button onclick="mostrarAba('comunidade')">COMUNIDADE</button>
  <button onclick="mostrarAba('servidores')">SERVERS</button>
  <button onclick="mostrarAba('ia')">IA</button>
</nav>

<div id="videos" class="aba ativa"><div id="lista-videos" class="video-grid">Carregando...</div></div>

<div id="shorts" class="aba"><div id="lista-shorts">Carregando...</div></div>

<div id="comunidade" class="aba">
  <div class="card">
    <h3>Postar</h3>
    <input id="nome" placeholder="Seu nome">
    <textarea id="mensagem" placeholder="O que você pensa?"></textarea>
    <input type="file" id="arquivo" accept="image/*,video/*">
    <div id="gif-box"></div>
    <input id="gif-pesquisa" placeholder="Pesquisar GIF..." onkeyup="buscarGif(this.value)">
    <button class="btn" onclick="postarComentario()">Postar</button>
  </div>
  <div id="lista-comentarios"></div>
</div>

<div id="servidores" class="aba"><div id="lista-servidores"></div></div>

<div id="ia" class="aba">
  <div class="card">
    <input id="pergunta-ia" placeholder="Pergunte sobre Minecraft...">
    <button class="btn" onclick="perguntarIA()">Enviar</button>
  </div>
  <div id="resposta-ia" class="card">Sou a IA do Tijolo 🧱</div>
</div>

<script>
let gifSelecionado = "";
const CHANNEL_ID = "UCtqAb6OTpfT-BRDgVp2aa3w";

function mostrarAba(id){
  document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('ativa');
  event.target.classList.add('active');
}

async function carregarVideos(){
  const res = await fetch(`/api/youtube`);
  const data = await res.json();
  document.getElementById('lista-videos').innerHTML = data.items.map(v=>`
    <div class="video"><iframe src="https://www.youtube.com/embed/${v.id.videoId}" allowfullscreen></iframe></div>
  `).join('');
}

async function carregarShorts(){
  const res = await fetch(`/api/youtube?type=short`);
  const data = await res.json();
  document.getElementById('lista-shorts').innerHTML = data.items.map(v=>`
    <div class="short"><iframe src="https://www.youtube.com/embed/${v.id.videoId}?autoplay=0&mute=1" allowfullscreen></iframe></div>
  `).join('');
}

async function carregarComentarios(){
  const res = await fetch('/api/comentarios');
  const data = await res.json();
  document.getElementById('lista-comentarios').innerHTML = data.map(c=>`
    <div class="comentario">
      <b>${c.nome}</b> <small>${new Date(c.created_at).toLocaleDateString()}</small><br>
      ${c.texto}
      ${c.foto? `<img src="${c.foto}">` : ''}
      ${c.gif? `<img src="${c.gif}">` : ''}
      <br><button class="btn" style="padding:5px" onclick="curtir(${c.id})">❤️ ${c.curtidas}</button>
    </div>
  `).join('');
}

async function buscarGif(q){
  if(q.length<2) return;
  const res = await fetch(`/api/gif?q=${q}`);
  const data = await res.json();
  document.getElementById('gif-box').innerHTML = data.data.slice(0,8).map(g=>`
    <img src="${g.images.fixed_height_small.url}" onclick="gifSelecionado='${g.images.original.url}'">
  `).join('');
}

async function postarComentario(){
  const nome = document.getElementById('nome').value;
  const texto = document.getElementById('mensagem').value;
  const arquivo = document.getElementById('arquivo').files[0];
  let foto = "";

  if(arquivo){
    const form = new FormData();
    form.append('file', arquivo);
    const up = await fetch('/api/uploadArquivo', {method:'POST', body:form});
    foto = (await up.json()).url;
  }

  await fetch('/api/comentar', {
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({nome,texto,foto,gif:gifSelecionado})
  });
  document.getElementById('mensagem').value = ""; gifSelecionado="";
  carregarComentarios();
}

async function curtir(id){await fetch(`/api/curtir?id=${id}`,{method:'POST'});carregarComentarios();}

async function carregarServidores(){
  const res = await fetch('/api/servidores');
  const data = await res.json();
  document.getElementById('lista-servidores').innerHTML = data.servidores.map(s=>`
    <div class="card server">
      <div><b>${s.nome}</b><br><small>${s.ip}</small></div>
      <div class="${s.online==-1?'offline':'online'}">${s.online==-1?'🔴 Offline':`🟢 ${s.online}/${s.max}`}</div>
    </div>
  `).join('');
}

async function perguntarIA(){
  const pergunta = document.getElementById('pergunta-ia').value;
  document.getElementById('resposta-ia').innerText = "Pensando...";
  const res = await fetch('/api/ia', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pergunta})});
  document.getElementById('resposta-ia').innerText = (await res.json()).resposta;
}

carregarVideos();carregarShorts();carregarComentarios();carregarServidores();
</script>
</body>
</html>
